---
- name: Deploy Django 6 Application
  hosts: webservers
  become: true
  vars:
    app_name: "my_django_app"
    app_dir: "/var/www/{{ app_name }}"
    venv_dir: "{{ app_dir }}/venv"
    app_user: "django"
    git_repo: "https://github.com"
    git_branch: "main"
    django_settings: "project.settings.production"

  tasks:
    - name: Install system package dependencies
      ansible.builtin.apt:
        name: [python3-pip, python3-venv, libpq-dev, git]
        state: present
        update_cache: true

    - name: Ensure target application directory exists
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: '0755'

    - name: Pull latest code from Git
      ansible.builtin.git:
        repo: "{{ git_repo }}"
        dest: "{{ app_dir }}"
        version: "{{ git_branch }}"
      become_user: "{{ app_user }}"

    - name: Create venv and install packages
      ansible.builtin.pip:
        requirements: "{{ app_dir }}/requirements.txt"
        virtualenv: "{{ venv_dir }}"
        virtualenv_command: python3 -m venv

    - name: Run Django migrations
      community.general.django_manage:
        command: migrate
        project_path: "{{ app_dir }}"
        virtualenv: "{{ venv_dir }}"
      become_user: "{{ app_user }}"

    - name: Collect static files
      community.general.django_manage:
        command: collectstatic
        project_path: "{{ app_dir }}"
        virtualenv: "{{ venv_dir }}"
      become_user: "{{ app_user }}"
