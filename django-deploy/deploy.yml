--
- name: Deploy Django App with Hypercorn
  hosts: web_servers
  become: yes
  vars:
    app_user: "django"
    app_dir: "/var/www/my_django_app"
    venv_dir: "/var/www/my_django_app/venv"
    repo_url: "git@github.com:your-org/my_django_app.git"
    branch: "main"

  tasks:
    - name: Install system dependencies
      ansible.builtin.apt:
        name:
          - python3-pip
          - python3-venv
          - git
          - nginx
        state: present
        update_cache: yes

    - name: Create application user
      ansible.builtin.user:
        name: "{{ app_user }}"
        state: present
        shell: /bin/bash

    - name: Clone repository
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "{{ app_dir }}"
        version: "{{ branch }}"
        force: yes
      become_user: "{{ app_user }}"

    - name: Install python requirements
      ansible.builtin.pip:
        requirements: "{{ app_dir }}/requirements.txt"
        virtualenv: "{{ venv_dir }}"
        virtualenv_python: python3
      become_user: "{{ app_user }}"

    - name: Run Django migrate
      community.general.django_command:
        command: migrate
        project_path: "{{ app_dir }}"
        virtualenv: "{{ venv_dir }}"
      become_user: "{{ app_user }}"

    - name: Run Django collectstatic
      community.general.django_command:
        command: collectstatic
        project_path: "{{ app_dir }}"
        virtualenv: "{{ venv_dir }}"
      become_user: "{{ app_user }}"

    - name: Create systemd service for Hypercorn
      ansible.builtin.template:
        src: hypercorn.service.j2
        dest: /etc/systemd/system/hypercorn.service
      notify:
        - Restart hypercorn

    - name: Ensure service is started and enabled
      ansible.builtin.systemd:
        name: hypercorn.service
        state: started
        enabled: yes

  handlers:
    - name: Restart hypercorn
      ansible.builtin.systemd:
        name: hypercorn.service
        state: restarted
